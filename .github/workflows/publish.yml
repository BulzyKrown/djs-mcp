name: Publish Package

# Triggers: tag push, main push, or GitHub release
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types: [created]

# Global permissions — minimal by default
permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      - name: Setup pnpm
        uses: pnpm/action-setup@0fb7401b0677f9d4f6daeab53f83f85db8f80a0d
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@bulzykrown'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Publish to GitHub Packages
        run: pnpm -F @bulzykrown/mcp-discordjs publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
